<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مدرب الإنجليزية</title>
<meta name="description" content="تعلّم الإنجليزية بالكلام: شرح بالعربية، تمارين، ومحادثة حيّة مع تصحيح فوري.">

<!-- الأيقونة والتثبيت على الشاشة الرئيسية -->
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="favicon-16.png" sizes="16x16" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#5B47F5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="مدرب الإنجليزية">
<meta name="mobile-web-app-capable" content="yes">

<link rel="stylesheet" href="styles/tokens.css">
<link rel="stylesheet" href="styles/app.css">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;800&family=Readex+Pro:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

</head>
<body>
<header><div class="inner">
  <span class="brand">
    <img src="icon.svg" alt="" width="32" height="32">
    <h1>مدرب الإنجليزية</h1>
    <svg class="flag" viewBox="0 0 60 40" role="img" aria-label="الإنجليزية">
      <clipPath id="fl"><rect width="60" height="40" rx="5"/></clipPath>
      <g clip-path="url(#fl)">
        <rect width="60" height="40" fill="#012169"/>
        <path d="M0 0 60 40M60 0 0 40" stroke="#fff" stroke-width="8"/>
        <path d="M0 0 60 40M60 0 0 40" stroke="#C8102E" stroke-width="4"/>
        <path d="M30 0V40M0 20H60" stroke="#fff" stroke-width="13"/>
        <path d="M30 0V40M0 20H60" stroke="#C8102E" stroke-width="7"/>
      </g>
    </svg>
  </span>
  <nav id="nav"></nav>
  <button class="themeBtn" onclick="go('settings')" aria-label="الإعدادات">⚙️</button>
</div></header>
<main class="wrap">
  <div class="screenTitle"><b id="hTitle"></b><span id="hSub"></span></div>
  <div id="app"></div>
</main>
<div class="toast" id="toast"></div>
<script type="module" src="app.js"></script>
</body>
</html>
