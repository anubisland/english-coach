<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مدرب الإنجليزية</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ============ نظام التصميم ============
   داكن افتراضاً، ونهاري عبر [data-theme=light] على <html>.
   أسماء الأصناف كما كانت، فما يعتمد عليها في الكود لم يتغيّر. */
:root{
  --bg:#0B0D1C; --surf:#15182E; --surf2:#1C2040; --line:#2A2F52;
  --ink:#F2F3FA; --mute:#A3A8C3; --faint:#7D82A6;
  --ind:#6D5BFF; --ind2:#8B7BFF; --soft:rgba(109,91,255,.16);
  --blue:#4C8DFF; --green:#35D07F; --teal:#00C2A8; --amber:#FFB020; --coral:#FF7A59;
  --onBlue:#06132B; --onGreen:#00241F; --onTeal:#002B25; --onAmber:#331F00;
  --okBg:rgba(53,208,127,.12); --badBg:rgba(255,122,89,.12);
  --warnBd:#B45309; --warnBg:#2B1B06; --warnInk:#FFC65C;
  --shadow:0 6px 20px rgba(0,0,0,.28);
}
:root[data-theme=light]{
  --bg:#F6F5FB; --surf:#FFFFFF; --surf2:#EFEDFB; --line:#E6E5F0;
  --ink:#16142E; --mute:#5A5E84; --faint:#5A5E84;
  --ind:#5B47F5; --ind2:#4635D6; --soft:#EFEDFB;
  --blue:#2F6BD4; --green:#00806F; --teal:#00806F; --amber:#B06A00; --coral:#C23F22;
  --onBlue:#fff; --onGreen:#fff; --onTeal:#fff; --onAmber:#fff;
  --okBg:rgba(0,128,111,.10); --badBg:rgba(194,63,34,.10);
  --warnBd:#B45309; --warnBg:#FFFBEB; --warnInk:#92400E;
  --shadow:0 4px 14px rgba(30,27,75,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'IBM Plex Sans Arabic',Cairo,system-ui,sans-serif;
  background:var(--bg);color:var(--ink);min-height:100vh;padding-bottom:96px;
  -webkit-font-smoothing:antialiased;
  padding-top:env(safe-area-inset-top,0px);
}
.en{font-family:Inter,'IBM Plex Sans Arabic',sans-serif;direction:ltr;unicode-bidi:isolate}
.dsp{font-family:'Readex Pro','IBM Plex Sans Arabic',sans-serif;font-weight:600}

header{padding:20px 20px 10px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
header h1{font:600 21px 'Readex Pro','IBM Plex Sans Arabic',sans-serif;line-height:1.3}
header p{color:var(--mute);font-size:12.5px;margin-top:4px;line-height:1.6}
.themeBtn{background:var(--surf);border:1px solid var(--line);color:var(--mute);
  width:38px;height:38px;flex:0 0 38px;border-radius:13px;display:grid;place-items:center;cursor:pointer;font-size:16px}

.wrap{padding:0 16px;max-width:560px;margin:auto}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:4px}
.stat{border-radius:18px;padding:13px 10px;display:flex;flex-direction:column;gap:3px}
.stat b{font:600 22px 'Readex Pro',sans-serif;line-height:1}
.stat span{font-size:11px;font-weight:600;line-height:1.35;opacity:.82}
.s1{background:var(--blue);color:var(--onBlue)}
.s2{background:var(--teal);color:var(--onTeal)}
.s3{background:var(--amber);color:var(--onAmber)}

.card{background:var(--surf);border:1px solid var(--line);border-radius:22px;padding:16px;margin-top:13px;box-shadow:var(--shadow)}
.card h2{font:600 16px 'Readex Pro','IBM Plex Sans Arabic',sans-serif;margin-bottom:9px;line-height:1.5}
.card.flat{box-shadow:none;background:transparent}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:0;border-radius:16px;
  background:var(--ind);color:#fff;padding:12px 19px;min-height:44px;
  font:700 14.5px 'IBM Plex Sans Arabic',sans-serif;cursor:pointer;margin-top:8px}
.btn.ghost{background:var(--surf2);color:var(--ind2)}
:root[data-theme=light] .btn.ghost{color:var(--ind)}
.btn:disabled{opacity:.5;cursor:not-allowed}

.opt{display:block;width:100%;text-align:left;background:var(--surf2);border:2px solid var(--line);
  border-radius:15px;padding:13px 15px;margin-top:9px;min-height:48px;
  font:600 16px Inter,sans-serif;cursor:pointer;color:var(--ink);direction:ltr}
.opt.ok{border-color:var(--green);background:var(--okBg)}
.opt.bad{border-color:var(--coral);background:var(--badBg)}

.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:var(--ind);border-radius:99px}

/* ====== خريطة الرحلة: خط متصل ومحطات ====== */
.unit{display:flex;gap:13px;align-items:stretch;padding:0;border:0}
.spine{width:34px;position:relative;display:grid;place-items:center;flex:0 0 34px}
.spine i{position:absolute;top:0;bottom:0;right:15.5px;width:3px;border-radius:2px;background:var(--line)}
.spine.lit i{background:var(--ind)}
.spine.first i{top:14px}
.spine.last i{bottom:auto;height:16px}
.dot{position:relative;width:24px;height:24px;border-radius:50%;background:var(--bg);
  border:2.5px solid var(--line);color:var(--faint);display:grid;place-items:center;
  font:700 11px 'IBM Plex Sans Arabic',sans-serif;flex-shrink:0}
.dot.done{background:var(--ind);border-color:var(--ind);color:#fff}
.dot.now{width:30px;height:30px;border-width:3.5px;border-color:var(--ind);background:var(--bg);box-shadow:0 0 0 5px var(--soft)}
.dot.mic{border-radius:9px}
.stop{flex:1;min-width:0;padding:3px 0 13px}
.stopCard{display:flex;align-items:center;gap:10px;border-radius:17px;padding:12px 14px;
  background:var(--surf);border:1px solid var(--line)}
.stopCard.now{background:var(--ind);border-color:var(--ind)}
.stopCard.now b,.stopCard.now .muted{color:#fff}
.stopCard.now .muted{opacity:.85}
.stopCard.locked{background:transparent;border-style:dashed}
.stopCard b{font-size:13.5px;font-weight:600;line-height:1.5}

.pill{display:inline-block;background:var(--okBg);color:var(--green);border-radius:999px;
  padding:4px 12px;font-size:12px;font-weight:700}
.muted{color:var(--mute);font-size:13px;line-height:1.8}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.mean{text-align:center}

/* ====== المحادثة ====== */
.bub{max-width:88%;border-radius:18px;padding:12px 15px;line-height:1.6}
.bub.them{align-self:flex-start;background:var(--surf2);border-bottom-left-radius:5px}
.bub.me{align-self:flex-end;background:var(--ind);color:#fff;border-bottom-right-radius:5px}
.stream{display:flex;flex-direction:column;gap:11px;margin-top:12px}
.fix{position:relative;display:inline-block;margin:0 2px}
.fix u{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);
  font-size:11.5px;font-weight:600;color:var(--green);text-decoration:none;white-space:nowrap;line-height:1.2}
.fix s{text-decoration-color:var(--coral);text-decoration-thickness:2px}
.bub.me .fix u{color:#B9FFD8}
.bub.me .fix s{text-decoration-color:#FFBCA8;color:#EFE9FF}
.meters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin-top:12px}
.meter b{display:block;font-size:10.5px;color:var(--faint);font-weight:600;text-align:center}
.meter u{display:block;height:5px;border-radius:3px;background:var(--line);margin-top:5px;overflow:hidden;text-decoration:none}
.meter u i{display:block;height:100%;border-radius:3px}

nav{position:fixed;bottom:0;left:0;right:0;background:var(--surf);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(3,1fr);padding:8px 10px calc(14px + env(safe-area-inset-bottom,0px));z-index:8}
.tab{background:none;border:0;font:600 10.5px 'IBM Plex Sans Arabic',sans-serif;color:var(--faint);
  display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;padding:6px 4px;min-height:44px}
.tab.on{color:var(--ind2)}
:root[data-theme=light] .tab.on{color:var(--ind)}
.tab svg{width:21px;height:21px;display:block}

.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:var(--surf2);
  border:1px solid var(--line);color:var(--ink);padding:11px 18px;border-radius:999px;
  font-size:13.5px;display:none;z-index:99;box-shadow:var(--shadow);max-width:90vw;text-align:center}

.warn{border:2px solid var(--warnBd);background:var(--warnBg)}
.warn h2,.warn .muted{color:var(--warnInk)}

table.g{width:100%;border-collapse:collapse;margin-top:10px;background:var(--bg);border-radius:12px;overflow:hidden}
table.g td{padding:8px 11px;border-bottom:1px solid var(--line);font-size:13px}
table.g tr:last-child td{border-bottom:0}
</style>
</head>
<body>
<header>
  <div>
    <h1 id="hTitle">مدرب الإنجليزية</h1>
    <p id="hSub">الكلام أولاً: شرح، تمرين، ثم محادثة حقيقية</p>
  </div>
  <button class="themeBtn" id="themeBtn" onclick="toggleTheme()" aria-label="تبديل الوضع الليلي">🌙</button>
</header>
<main class="wrap" id="app"></main>
<nav id="nav"></nav>
<div class="toast" id="toast"></div>

const LESSONS=[
{id:'1.1',u:1,t:'I am / You are',rules:['be-subject'],more:'<b>القاعدة الأساسية:</b> كل جملة إنجليزية تحتاج فعلاً، وهذا الفعل يتغير حسب الشخص أو الشيء الذي يقوم بالفعل.<br><br>• <b>I</b> ← am (أنا)<br>• <b>you / we / they</b> ← are (أنت / نحن / هم)<br>• <b>he / she / it</b> ← is (هو / هي / هذا)<br>• الاسم المفرد مثل Mom أو my name يعامل معاملة he / she / it فنستخدم is.<br>• إذا جمعت اسمين بـ and صار الفاعل جمعاً، مثل: Ahmed and Sara are.<br><br><b>لماذا هي مهمة؟</b> ستستخدمها في كل جملة تعرّف بها نفسك، أو تصف حالك، أو تتحدث عن الناس من حولك في البيت والعمل والشارع.', ex:'نستخدم am مع I فقط، ونستخدم are مع you وwe وthey.',s:['I am a student.','You are my friend.','We are ready.','I am at work now.','Are you hungry? Yes, I am.','Hi, I am Sara. Nice to meet you!'],items:[

   كتلة محتوى مستقلة: تنتقل إلى content/rules.js في المرحلة 1 كما هي.
   ====================================================== */
const RULES=[
{id:'be-subject',

  'الاختصار في الكلام: <span class=en>I\'m</span> و<span class=en>he\'s</span> و<span class=en>they\'re</span>. المعنى نفسه، لكنه أقرب للكلام الطبيعي.'],

      '<span class=en>He are my brother.</span> ← الصواب <span class=en>He is my brother.</span>',
      '<span class=en>I student.</span> ← جملة بلا فعل، والصواب <span class=en>I am a student.</span>'],
 ar:'العربية تقول «أنا طالب» بكلمتين بلا فعل، لأن فعل الكون محذوف في المضارع. الإنجليزية لا تقبل جملة بلا فعل أبداً، فتضيف am. ولهذا ينسى المتعلّم العربي هذا الفعل تحديداً أكثر من أي شيء آخر. القاعدة العملية: إن لم يكن في جملتك فعل، فأنت تحتاج am أو is أو are.'},

{id:'present-base',
 t:'المضارع البسيط مع I / you / we / they',

{id:'present-s',
 t:'المضارع البسيط مع he / she / it: إضافة s',

/* ================= الحالة ================= */
const K='eng-coach-v3';
const SCHEMA=4;

/* البنية الكاملة للحالة. كل حقل جديد يُضاف هنا أولاً، وإلا انهار التطبيق عند أول استخدام. */
function defaultState(){return{
  v:SCHEMA,
  placed:false,             // الدخول الأول يبدأ باختبار تحديد المستوى
  level:'A1',
  lessons:{},conv:{},cp:{},ret:{},exam:false,xp:0,
  tab:'home',q:null,open:null,ci:0,place:null,
  errs:{},                  // عدّاد أخطاء الجرامر المتكررة
  ruleOpen:null,            // بطاقة القاعدة المفتوحة حالياً
  theme:'dark',             // 'dark' أو 'light'
  goal:10,                  // هدف دقائق الكلام اليومي
  chat:{sc:0,ti:0,miss:0,stage:'reply',ok:null,g:null,said:null,fixed:null,pr:null,fb:null,hint:false}
}}

/* هل في الحالة المحفوظة أثر عمل سابق؟ */
function hasProgress(x){
  if(!x||typeof x!=='object')return false;
  if(Number.isFinite(x.xp)&&x.xp>0)return true;
  if(x.exam===true)return true;
  for(const k of ['lessons','conv','cp','ret'])
    if(x[k]&&typeof x[k]==='object'&&Object.keys(x[k]).length)return true;
  return false;
}

/* يرقّي أي حالة محفوظة من إصدار سابق إلى البنية الحالية دون فقد تقدّم المستخدم. */
function migrate(saved){
  const S=defaultState();
  if(!saved||typeof saved!=='object')return S;
  /* نتحقق من نوع كل قيمة بدل نسخها كما هي: xp كنصّ مثلاً يجعل addXp يدمج بدل أن يجمع. */
  /* من عنده تقدّم محفوظ هو مستخدم قديم: لا نوقفه عند اختبار لم يكن موجوداً حين بدأ. */
  if(saved.placed===true||hasProgress(saved))S.placed=true;
  if(typeof saved.exam==='boolean')S.exam=saved.exam;
  if(Number.isFinite(saved.xp)&&saved.xp>=0)S.xp=saved.xp;
  if(Number.isInteger(saved.ci)&&saved.ci>=0)S.ci=saved.ci;
  if(LEVELS.includes(saved.level))S.level=saved.level;
  if(saved.theme==='light'||saved.theme==='dark')S.theme=saved.theme;
  if([5,10,20].includes(saved.goal))S.goal=saved.goal;
  if(VIEWS_KEYS.includes(saved.tab))S.tab=saved.tab;
  if(saved.place&&typeof saved.place==='object')S.place=saved.place;
  /* الدرس المفتوح مؤشر إلى محتوى قد يختفي بين إصدارين.
     مؤشر ميت كان يُسقط الإقلاع كله ويترك شاشة بيضاء بلا شريط تنقل ولا مخرج. */
  if(typeof saved.open==='string'&&LESSONS.some(l=>l.id===saved.open))S.open=saved.open;
  for(const k of ['lessons','conv','cp','ret','errs'])
    if(saved[k]&&typeof saved[k]==='object')S[k]=saved[k];
  if(saved.chat&&typeof saved.chat==='object')Object.assign(S.chat,saved.chat);
  if(!S.chat.pr||typeof S.chat.pr!=='object')S.chat.pr=null;
  S.v=SCHEMA;
  return S;
}

const LEVELS=['A1','A2'];
const VIEWS_KEYS=['home','course','speak'];   // يجب أن يطابق مفاتيح VIEWS في آخر الملف
let S,bootWarn=null;
try{S=migrate(JSON.parse(localStorage.getItem(K)||'null'))}
catch(e){
  S=defaultState();logError('قراءة التقدم المحفوظ',e);
  bootWarn='إن كنت تستخدم التصفح الخاص أو حجب بيانات المواقع فجرّب نافذة عادية.';
}

/* الفشل الصامت أخفى عطلاً حقيقياً من قبل: كل خطأ يُسجَّل ويظهر للمستخدم. */
function logError(where,e){
  try{console.error('[مدرب الإنجليزية] '+where+':',e)}catch(_){}
}
/* الحالة دائمة، فالتحذير يجب أن يدوم أيضاً.
   تنبيه يختفي بعد ثانيتين لا يكفي لمن سيُكمل أربعين دقيقة ثم يفقد كل شيء. */
let saveFailed=false;
function save(){
  const c=Object.assign({},S);delete c.q;
  try{localStorage.setItem(K,JSON.stringify(c));saveFailed=false}
  catch(e){
    logError('حفظ التقدم',e);
    if(!saveFailed){saveFailed=true;render()}
  }
}
function addXp(n){S.xp+=n}
function toast(t){const e=document.getElementById('toast');if(!e)return;e.textContent=t;e.style.display='block';clearTimeout(e._t);e._t=setTimeout(()=>e.style.display='none',1800)}
/* الفشل الشائع للنطق غير متزامن (لا إذن، أو لا صوت إنجليزي مثبّت) ويصل عبر onerror لا عبر throw. */
function say(t,r=0.9){
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=r;
    u.onerror=ev=>{logError('نطق الجملة',(ev&&ev.error)||ev);toast('تعذّر تشغيل الصوت، جرّب Chrome أو Edge')};
    speechSynthesis.speak(u);
  }catch(e){logError('تشغيل الصوت',e);toast('الصوت غير متاح في هذا المتصفح، جرّب Chrome أو Edge')}
}

/* ================= أدوات ================= */
LESSONS.forEach(l=>{if(l.rules&&l.rules.length)l.items.forEach(it=>ITEM_RULE.set(it,l.rules[0]))});
const unitLessons=u=>LESSONS.filter(l=>l.u===u);
const unitItems=u=>unitLessons(u).flatMap(l=>l.items);
const itemsUpTo=u=>[1,2,3].filter(x=>x<=u).flatMap(unitItems);
const shuffle=a=>a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(x=>x[1]);
const PLACE=LESSONS.flatMap(l=>l.items).map(i=>Object.assign({},i,{lv:1})).concat(PLACE2);
const unitOpen=u=>u===1||(!!S.cp[u-1]&&!!S.ret[u-1]);
const lessonOpen=l=>{if(!unitOpen(l.u))return false;const ls=unitLessons(l.u);const i=ls.indexOf(l);return i===0||!!S.lessons[ls[i-1].id]};
const examOpen=()=>[1,2,3].every(u=>S.cp[u])&&[1,2].every(u=>S.ret[u]);
const convoList=u=>CONVO.filter(c=>c.u===u);
const convoOpen=c=>{const L=convoList(c.u),i=L.indexOf(c);return unitOpen(c.u)&&unitLessons(c.u).every(l=>S.lessons[l.id])&&(i===0||!!S.conv[L[i-1].id])};
/* محطة واحدة على خط الرحلة: نقطة على الخط، وبطاقة بجوارها. */
function stop(o){
  const card=`<div class="stopCard ${o.cls||''}"><span style="flex:1;min-width:0">
      <b>${o.title}</b><span class="muted" style="display:block;font-size:11.5px">${o.meta}</span></span>
      ${o.act?`<span class="btn ghost" style="margin:0;padding:8px 13px;min-height:0;font-size:12px">${o.cls==='now'?'تابع':'افتح'}</span>`:''}</div>`;
  return `<div class="unit"><div class="spine ${o.lit?'lit':''} ${o.first?'first':''} ${o.last?'last':''}"><i></i>${o.dot}</div>
    <div class="stop">${o.act?`<a href="javascript:void(0)" onclick="${o.act}" style="text-decoration:none;color:inherit;display:block">${card}</a>`:card}</div></div>`;
}
function convoHtml(u){
  const L=convoList(u);
  return L.map(c=>{const ok=!!S.conv[c.id],av=convoOpen(c);
    return stop({
      lit:ok,
      dot:ok?`<div class="dot done mic">${svg('check',13,'var(--onGreen)')}</div>`
          :`<div class="dot mic">${svg('mic',12)}</div>`,
      cls:av&&!ok?'':(av?'':'locked'),
      title:'محادثة: '+c.t,
      meta:av?(ok?'مكتملة · اضغط للإعادة':'تدرّب على القاعدة في حوار'):'بعد إتقان دروس الوحدة',
      act:av?`launch('conv','${c.id}')`:''
    })}).join('');
}

  course:['خريطة الرحلة','محطة بعد محطة حتى تتقن المستوى'],
  speak:['المحادثة الحيّة','تكلّم، وسنصحّح لك بالعربية']
};
function renderHead(){
  const h=HEAD[S.tab]||HEAD.home;
  const t=document.getElementById('hTitle'),p=document.getElementById('hSub');
  if(t)t.textContent=h[0];
  if(p)p.textContent=h[1];
}
function render(){
  const app=document.getElementById('app');
  try{
    applyTheme();
    renderHead();
    renderNav();
    app.innerHTML=banners()+(S.q?quizView():VIEWS[S.tab]());
  }catch(e){
    /* أي استثناء هنا كان يترك الصفحة فارغة بلا شريط تنقل ولا مخرج. */
    logError('رسم الشاشة',e);
    if(app)app.innerHTML='<div class="card"><h2>تعذّر عرض هذه الشاشة</h2><p class=muted>حدث خطأ غير متوقع، وتقدّمك محفوظ.</p><div class=row><button class=btn onclick="goHome()">العودة إلى الرئيسية</button></div></div>';
  }
}
function goHome(){S.tab='home';S.q=null;S.open=null;save();render()}

/* آخر خط دفاع: أي استثناء داخل أي onclick كان يُجمّد الواجهة بصمت. */
if(window.addEventListener)window.addEventListener('error',ev=>{
  logError('خطأ غير متوقع',(ev&&(ev.error||ev.message))||ev);
  toast('حدث خطأ غير متوقع. أعد تحميل الصفحة إن توقّف التطبيق');
});

/* ================= الرئيسية ================= */
/* الخطوة التالية بالضبط: درس، أو محادثة، أو بوابة وحدة، أو الامتحان. */
function nextStep(){
  for(const u of [1,2,3]){
    if(!unitOpen(u))continue;
    const l=unitLessons(u).find(x=>lessonOpen(x)&&!S.lessons[x.id]);
    if(l)return{label:`الدرس ${l.id}: ${l.t}`,act:`openLesson('${l.id}')`,cta:'تابع الدرس'};
    const c=convoList(u).find(x=>convoOpen(x)&&!S.conv[x.id]);
    if(c)return{label:`محادثة: ${c.t}`,act:`launch('conv','${c.id}')`,cta:'ابدأ المحادثة'};
    if(!S.cp[u])return{label:`بوابة الوحدة ${u}`,act:`launch('cp',${u})`,cta:'ابدأ الاختبار'};
    if(u!==3&&!S.ret[u])return{label:`اختبار الاستبقاء للوحدة ${u}`,act:`launch('ret',${u})`,cta:'ابدأ الاختبار'};
  }
  if(examOpen()&&!S.exam)return{label:'الامتحان النهائي A1',act:"launch('exam')",cta:'ابدأ الامتحان'};
  return null;
}

function homeView(){
  const done=LESSONS.filter(l=>S.lessons[l.id]).length;
  if(!S.placed) return card('أهلاً بك 👋',
    '<p class="muted">قبل أن نبدأ، اختبار قصير من 10 أسئلة يحدد نقطة انطلاقك. يستغرق دقيقتين، ولا توجد إجابة تُحسب عليك.</p><div class="row"><button class="btn" onclick="launch(\'place\')">ابدأ اختبار تحديد المستوى</button></div>');

  const nx=nextStep();
  const pct=Math.round(done/LESSONS.length*100);
  const top=Object.entries(S.errs||{}).sort((a,b)=>b[1]-a[1])[0];

  return ringCard(pct)+
  `<div class="stats">
    <div class="stat s1"><b>${ar(done)}<span style="font-size:14px">/${ar(LESSONS.length)}</span></b><span>دروس متقنة</span></div>
    <div class="stat s2"><b>${ar(Object.keys(S.cp).length)}<span style="font-size:14px">/٣</span></b><span>وحدات مجتازة</span></div>
    <div class="stat s3"><b>${ar(S.xp)}</b><span>نقاط XP</span></div></div>`+
  (nx?card('تابع من حيث توقفت',
    `<p style="font-size:15px;font-weight:600;line-height:1.6">${nx.label}</p>
     <div class="row" style="justify-content:flex-start"><button class="btn" onclick="${nx.act}">${svg('mic',18,'#fff')} ${nx.cta}</button></div>`):'')+
  (top?card('خطؤك المتكرر',
    `<div style="display:flex;align-items:center;gap:11px">
       <span style="width:40px;height:40px;flex:0 0 40px;display:grid;place-items:center;background:var(--badBg);border-radius:13px;color:var(--coral)">${svg('alert',19)}</span>
       <span style="flex:1;min-width:0"><span class="muted" style="display:block">${top[0]}</span>
       <span class="muted" style="display:block;font-size:12px">تكرر ${ar(top[1])} مرة</span></span>
       <button class="btn ghost" style="margin:0" onclick="go('speak')">درّبني</button></div>`):'')+
  card('الامتحان النهائي',
    `<p class="muted">${S.exam?'🎉 أتممت مستوى A1':'يُفتح بعد اجتياز الوحدات الثلاث واختبارات الاستبقاء'}</p>
     <div class="row" style="justify-content:flex-start"><button class="btn ghost" onclick="go('course')">عرض الرحلة كاملة</button></div>`);
}

/* أرقام عربية-هندية في الواجهة العربية، والإنجليزية تبقى كما هي. */
function ar(n){return String(n).replace(/[0-9]/g,c=>'٠١٢٣٤٥٦٧٨٩'[+c])}

/* حلقة التقدّم مرسومة كموجة صوت: النجاح هنا هو الكلام، لا النقر. */
function ringCard(pct){
  const C=414.7, p=Math.max(0,Math.min(1,pct/100));
  const lens=[6,11,4,13,7,9,5,14,8,6,12,5];
  let ticks='';
  for(let i=0;i<48;i++){
    const a=(-90+i*7.5)*Math.PI/180, len=lens[i%lens.length];
    const x1=(100+81*Math.cos(a)).toFixed(1), y1=(100+81*Math.sin(a)).toFixed(1);
    const x2=(100+(81+len)*Math.cos(a)).toFixed(1), y2=(100+(81+len)*Math.sin(a)).toFixed(1);
    ticks+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${i/48<p?'var(--ind)':'var(--line)'}" stroke-width="2.4" stroke-linecap="round"/>`;
  }
  const goals=[5,10,20].map(g=>`<button class="btn${g===S.goal?'':' ghost'}" style="margin:0;padding:8px 15px;min-height:0;border-radius:999px;font-size:12.5px${g===S.goal?'':';background:transparent;color:var(--mute)'}" onclick="setGoal(${g})">${ar(g)} د</button>`).join('');
  return `<div class="card" style="display:flex;flex-direction:column;align-items:center;padding-top:10px">
    <div style="position:relative;width:186px;height:186px">
      <svg width="186" height="186" viewBox="0 0 200 200" role="img" aria-label="أتممتَ ${pct} بالمئة من دروس المستوى">
        <circle cx="100" cy="100" r="66" fill="none" stroke="var(--line)" stroke-width="13"/>
        <circle cx="100" cy="100" r="66" fill="none" stroke="var(--ind)" stroke-width="13" stroke-linecap="round"
                stroke-dasharray="${C}" stroke-dashoffset="${(C*(1-p)).toFixed(1)}" transform="rotate(-90 100 100)"/>
        ${ticks}
      </svg>
      <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center">
        <span class="dsp" style="font-size:44px;line-height:1">${ar(pct)}<span style="font-size:20px">٪</span></span>
        <span class="muted" style="font-size:12px">من مستوى <span class="en">${S.level}</span></span>
      </div>
    </div>
    <div class="muted" style="font-size:12px;margin-top:10px">هدف الكلام اليومي</div>
    <div role="group" aria-label="هدف اليوم" style="display:flex;gap:5px;background:var(--surf2);border-radius:999px;padding:4px;margin-top:7px">${goals}</div>
  </div>`;
}
function setGoal(g){S.goal=g;save();render()}


/* ================= المسار ================= */
function unitDone(n){return unitLessons(n).every(l=>S.lessons[l.id])&&convoList(n).every(c=>S.conv[c.id])&&!!S.cp[n]&&(n===3||!!S.ret[n])}
function unitStatus(n){if(unitDone(n))return '<span class=pill>✅ مكتملة</span>';if(unitOpen(n))return '<span class=pill style="background:#EEF2FF;color:var(--ind)">📍 الوحدة الحالية</span>';return '<span class=pill style="background:#F3F4F6;color:var(--mute)">🔒 مقفلة</span>'}
function courseView(){setTimeout(()=>{const p=[...document.querySelectorAll('.pill')].find(e=>e.textContent.includes('الوحدة الحالية'));if(p&&!S.open)p.scrollIntoView({block:'start'})},0);
  if(!S.placed) return card('ابدأ بتحديد المستوى أولاً','<div class="row"><button class="btn" onclick="launch(\'place\')">اختبار تحديد المستوى</button></div>');
  let h=card('اختبار تحديد المستوى (اختياري)',`<p class='muted'>يُنصح به لمعرفة مستواك قبل بدء الوحدات، ولا يلزم لبدء الدورة من A1.</p><div class='row'><button class='btn ghost' onclick="launch('place')">ابدأ الاختبار</button></div>`);
  const openLes=S.open?LESSONS.find(x=>x.id===S.open):null;
  if(S.open&&!openLes)S.open=null;
  if(openLes){const l=openLes;
    h+=card(`الدرس ${l.id}: ${l.t}`,`<p>${l.ex}</p>${l.more?`<div class='muted' style='margin-top:10px;line-height:1.9'>${l.more}</div>`:''}${(l.rules||[]).map(r=>ruleCard(r,'full')).join('')}<div class="en muted" style="margin-top:10px;line-height:1.9">${l.s.map(x=>'• '+x).join('<br>')}</div>
      <div class="row"><button class="btn" onclick="launch(\'lesson\',\'${l.id}\')">ابدأ تمارين الدرس</button><button class="btn ghost" onclick="S.open=null;render()">إغلاق</button></div>`);}
  for(const u of UNITS){
    const LS=unitLessons(u.n);
    const ls=LS.map((l,i)=>{const ok=!!S.lessons[l.id],av=lessonOpen(l);
      const now=av&&!ok;
      return stop({
        first:i===0,
        lit:ok||now,
        dot:ok?`<div class="dot done">${svg('check',13,'var(--onGreen)')}</div>`
            :now?'<div class="dot now"></div>'
            :`<div class="dot">${svg('lock',11)}</div>`,
        cls:now?'now':(av?'':'locked'),
        title:`${l.id} — ${l.t}`,
        meta:av?(ok?'متقن · اضغط للمراجعة':`${ar(l.items.length)} تمارين`):'يفتح بعد الدرس السابق',
        act:av?`openLesson('${l.id}')`:''
      })}).join('');
    const gate=`${cpBtn(u.n)}${retBtn(u.n)}`;
    const extra=unitOpen(u.n)?convoHtml(u.n)+stop({
      last:true,lit:!!S.cp[u.n],
      dot:S.cp[u.n]?`<div class="dot done">${svg('check',13,'var(--onGreen)')}</div>`:`<div class="dot mic">${svg('shield',13)}</div>`,
      cls:'locked',
      title:`بوابة الوحدة ${ar(u.n)}`,
      meta:S.cp[u.n]?'مُجتازة':'٨ أسئلة · تحتاج ٧ صحيحة'
    }).replace('</div></div>',`<div class="row" style="justify-content:flex-start">${gate}</div></div></div>`):'';
    h+=card(`الوحدة ${u.n}: ${u.t} ${unitStatus(u.n)}`, unitOpen(u.n)?(unitDone(u.n)?'<details><summary class=muted>عرض دروس الوحدة للمراجعة</summary>'+ls+extra+'</details>':ls+extra):'<p class="muted">🔒 تُفتح بعد اجتياز اختبار الوحدة السابقة واختبار استبقائها</p>');
  }
  h+=card('الامتحان النهائي لـ A1', examOpen()&&!S.exam?'<div class="row"><button class="btn" onclick="launch(\'exam\')">ابدأ الامتحان النهائي</button></div>':(S.exam?'<p>🎉 أتممت A1</p>':'<p class="muted">🔒 يُفتح بعد اجتياز الوحدات الثلاث</p>'));
  return h;
}
function openLesson(id){S.open=id;S.tab='course';save();render();window.scrollTo(0,0)}
function cpBtn(u){
  if(!unitLessons(u).every(l=>S.lessons[l.id])||!convoList(u).every(c=>S.conv[c.id])) return '';
  if(S.cp[u]) return '<span class="pill">✓ اختبار الوحدة مُجتاز</span>';
  return `<button class="btn" onclick="launch('cp',${u})">اختبار الوحدة ${u}</button>`;
}
function retBtn(u){
  if(!S.cp[u]||u===3) return '';
  if(S.ret[u]) return '<span class="pill">✓ الاستبقاء مُجتاز</span>';
  return `<button class="btn ghost" onclick="launch('ret',${u})">اختبار الاستبقاء</button>`;
}

/* ================= المحرك: الاختبارات ================= */
function launch(kind,id){window.scrollTo(0,0);_launch(kind,id)}
function _launch(kind,id){
  const q={kind,id,i:0,got:[],wrong:[],picked:null,done:false,theta:1};
  if(kind==='lesson'){const l=LESSONS.find(x=>x.id===id);Object.assign(q,{items:l.items,title:'درس '+l.id,need:l.items.length})}
  else if(kind==='cp'){Object.assign(q,{items:shuffle(unitItems(id)).slice(0,8),title:'اختبار الوحدة '+id,need:7})}
  else if(kind==='ret'){Object.assign(q,{items:shuffle(itemsUpTo(id)).slice(0,4),title:'اختبار الاستبقاء (حتى الوحدة '+id+')',need:3})}
  else if(kind==='exam'){Object.assign(q,{items:shuffle(itemsUpTo(3)).slice(0,10),title:'الامتحان النهائي A1',need:8})}
  else if(kind==='conv'){const c=CONVO.find(x=>x.id===id);Object.assign(q,{title:'محادثة: '+c.t,items:c.turns.map(t=>({q:t.p,o:t.o,a:t.a,tip:t.tip})),need:c.turns.length})}
  else if(kind==='place'){Object.assign(q,{title:'تحديد المستوى',items:[pickPlace(q)]})}
  S.q=q;render();window.scrollTo(0,0);
}
function pickPlace(q){
  const used=q.items.map(x=>x.q);const pool=PLACE.filter(x=>!used.includes(x.q));
  const want=q.theta>=1.5?2:1;let c=pool.filter(x=>x.lv===want);if(!c.length)c=pool;
  return shuffle(c)[0];
}
function pick(k){
  const q=S.q;if(q.picked!=null)return;
  const it=q.items[q.i],ok=k===it.a;
  q.picked=k;q.choiceOk=ok;if(q.kind!=='conv'){q.got.push(ok);if(!ok)q.wrong.push(it)}
  if(q.kind==='place')q.theta=Math.min(2,Math.max(1,q.theta+(ok?0.5:-0.5)));
  render();
}
function nextQ(){window.scrollTo(0,0);
  const q=S.q;q.i++;q.picked=null;q.spoke=null;q.att=0;q.feedback=null;q.choiceOk=null;
  const total=q.kind==='place'?10:q.items.length;
  if(q.i>=total)endQ();
  else if(q.kind==='place')q.items.push(pickPlace(q));
  render();
}
function endQ(){
  const q=S.q;q.done=true;q.score=q.got.filter(Boolean).length;
  if(q.kind==='lesson'){q.pass=q.score===q.items.length;if(q.pass){S.lessons[q.id]=true;addXp(20)}}
  else if(q.kind==='cp'){q.pass=q.score>=q.need;if(q.pass){S.cp[q.id]=true;addXp(50)}}
  else if(q.kind==='ret'){q.pass=q.score>=q.need;if(q.pass){S.ret[q.id]=true;addXp(30)}}
  else if(q.kind==='conv'){q.pass=q.score===q.items.length;if(q.pass){S.conv[q.id]=true;addXp(40)}}
  else if(q.kind==='exam'){q.pass=q.score>=q.need;if(q.pass){S.exam=true;addXp(100)}}
  else if(q.kind==='place'){
    const rows=q.items.map((x,i)=>({lv:x.lv,ok:q.got[i]}));
    const r1=rows.filter(r=>r.lv===1),r2=rows.filter(r=>r.lv===2);
    const a1=r1.length?r1.filter(r=>r.ok).length/r1.length:0;
    const a2=r2.length?r2.filter(r=>r.ok).length/r2.length:0;
    S.level=(r2.length>=2&&a2>=0.75)?'A2':'A1';S.placed=true;S.place={a1,a2,n1:r1.length,n2:r2.length};q.pass=true;
  }
  save();
}
function speakPanel(q,it){if(q.kind!=='conv'||q.picked==null)return '';if(q.spoke!=null)return `<p class=muted style='margin-top:8px'>دقة النطق: ${q.spoke}%${q.heard?'<br>سمعتُ: «'+q.heard+'»':''}</p>`;return `<div style='background:#EEF2FF;border-radius:14px;padding:12px;margin-top:12px'><div class=muted>الآن قل الجملة الصحيحة بصوتك أو اكتبها:</div><div class=en style='font-size:18px;margin:8px 0;font-weight:700'>${it.o[it.a]}</div><div class=row><button class=btn onclick='mic2()'>🎙️ تحدّث</button></div><div class=row style='margin-top:8px'><input id=ctxt2 class=en placeholder='Type it' style='direction:ltr;max-width:220px;margin:0;padding:10px;border:2px solid var(--line);border-radius:12px'><button class='btn' onclick='typed2()'>✓</button></div>${q.heard?`<p class=muted style='margin-top:8px'>سمعتُ: «${q.heard}»</p>`:''}${q.feedback?`<p class=muted style='margin-top:8px'>${q.feedback}</p>`:''}</div>`}
function words(s){return s.toLowerCase().replace(/[^\w\s]/g,'').split(/\s+/).filter(Boolean)}
function speakTurn(said){const q=S.q;if(!q||q.kind!=='conv'||q.spoke!=null||!said)return;const it=q.items[q.i];const T=words(it.o[it.a]),G=words(said);const sc=Math.round(T.filter(w=>G.includes(w)).length/T.length*100);q.heard=said;q.att=(q.att||0)+1;if(sc>=75||q.att>=2){q.spoke=sc;const pass=!!q.choiceOk&&sc>=75;q.got.push(pass);if(!pass)q.wrong.push(it);addXp(pass?10:2);save()}else{q.feedback='حاول مرة أخرى، لم أسمع: '+T.filter(w=>!G.includes(w)).join(' ')}render()}
function mic2(){const R=window.SpeechRecognition||window.webkitSpeechRecognition;const q=S.q;if(!R){q.feedback='التعرف على الصوت غير مدعوم هنا، اكتب الجملة في المربع';render();return}const r=new R();r.lang='en-US';r.onresult=e=>speakTurn(e.results[0][0].transcript.trim());r.onerror=e=>{q.feedback='تعذّر التسجيل ('+e.error+')';render()};
 try{r.start()}catch(x){logError('بدء التسجيل',x);q.feedback='تعذّر بدء التسجيل. اضغط مرة واحدة فقط، أو اكتب الجملة في المربع';render()}}
function typed2(){const el=document.getElementById('ctxt2');speakTurn(el?el.value.trim():'')}
function retryQ(){const q=S.q;launch(q.kind,q.id)}
function closeQ(){const q=S.q;const wasPlace=q&&q.kind==='place';if(wasPlace){S.q=null;S.tab='home';save();render();return}if(q&&q.kind==='lesson'){const i=LESSONS.findIndex(l=>l.id===q.id);const nx=LESSONS[i+1];S.open=q.pass?(nx&&lessonOpen(nx)?nx.id:null):q.id}else{S.open=null}S.q=null;S.tab='course';save();render();window.scrollTo(0,0)}
/* الخطأ هو لحظة التعليم: نفتح الشرح تلقائياً عنده، ونتركه زراً عند الإجابة الصحيحة. */
function itemRuleHtml(q,it){
  const id=ITEM_RULE.get(it);if(!id)return '';
  if(q.picked===it.a&&S.ruleOpen!==id)
    return `<div class="row" style="margin-top:8px"><button class='btn ghost' onclick="toggleRule('${id}')">راجع القاعدة</button></div>`;
  return ruleCard(id,'brief');
}
function quizView(){
  const q=S.q;
  if(q.done){
    if(q.kind==='place'){const p=S.place;
      return card('نتيجة تحديد المستوى',`<p>مستواك: <b class="en" style="font-size:26px">${S.level}</b></p>
        <p class="muted">دقتك في أسئلة A1: ${Math.round(p.a1*100)}%${p.n2>=2?'، وفي أسئلة A2: '+Math.round(p.a2*100)+'%':''}</p>
        <div class="row"><button class="btn" onclick="closeQ()">ابدأ الدورة</button></div>`);}
    const pc=Math.round(q.score/q.items.length*100);
    const tips=q.wrong.map(x=>`<p class="muted">💡 ${x.tip}</p>`).join('');
    return `<div class="card" style="text-align:center;padding-top:22px">
        <div class="dsp" style="font-size:52px;line-height:1;color:${q.pass?'var(--green)':'var(--amber)'}">${ar(q.score)}<span style="font-size:24px;color:var(--mute)">/${ar(q.items.length)}</span></div>
        <div class="bar" style="max-width:220px;margin:14px auto 0"><i style="width:${pc}%;background:${q.pass?'var(--green)':'var(--amber)'}"></i></div>
        <h2 style="margin-top:14px">${q.pass?'🎉 اجتزت '+q.title:'لم تجتز بعد'}</h2>
        <p class="muted">${q.pass?'أحسنت، تابع إلى الخطوة التالية':'المطلوب '+ar(q.need)+' إجابات صحيحة'}</p>
        <div class="row" style="margin-top:6px">${q.pass?'<button class="btn" onclick="closeQ()">متابعة</button>':'<button class="btn" onclick="retryQ()">أعد المحاولة</button><button class="btn ghost" onclick="closeQ()">رجوع</button>'}</div>
      </div>${tips?card('ما تحتاج مراجعته',tips):''}`;
  }
  const it=q.items[q.i],total=q.kind==='place'?10:q.items.length;
  const opts=it.o.map((o,k)=>{let c='';if(q.picked!=null){if(k===it.a)c='ok';else if(k===q.picked)c='bad'}
    return `<button class="opt en ${c}" ${q.picked!=null?'disabled':''} onclick="pick(${k})">${o}</button>`}).join('');
  return `<div class="card">
     <div style="display:flex;align-items:center;gap:11px">
       <div class="bar" style="flex:1;margin:0"><i style="width:${q.i/total*100}%"></i></div>
       <span class="muted" style="font-size:12px;font-weight:700;flex:0 0 auto">${ar(q.i+1)} / ${ar(total)}</span></div>
     <p class="muted" style="margin-top:12px;font-size:12px">${q.title}</p>
     <div class="mean en" style="font-size:19px;margin-top:6px;line-height:1.7;font-weight:500">${it.q}</div>${opts}
     ${speakPanel(q,it)}${q.picked!=null&&(q.kind!=='conv'||q.spoke!=null)?`<p class='muted' style='margin-top:10px'>💡 ${it.tip}</p>${itemRuleHtml(q,it)}<div class="row"><button class="btn" onclick="nextQ()">${q.i+1>=total?'النتيجة':'التالي ←'}</button></div>`:''}
     <div class="row" style="margin-top:4px"><button class="btn ghost" style="background:transparent;color:var(--faint)" onclick="closeQ()">إلغاء</button></div></div>`;
}

function oldSpeakView(){
  const P=CONV[S.ci%CONV.length];
  return card('محادثة سريعة 🗣️',`<p class="muted">أجب بجملة كاملة بالصوت أو بالكتابة</p>
    <div class="mean en" style="font-size:19px">${P}</div>
    <div class="row" style="margin-top:12px"><button class="btn ghost" onclick="say('${P}')">🔊 استمع</button><button class="btn" onclick="mic()">🎙️ أجب بالصوت</button><button class="btn ghost" onclick="S.ci++;save();render()">سؤال آخر</button></div>
    <div class="row" style="margin-top:12px"><input id="ctxt" class="en" placeholder="Type your answer" style="direction:ltr;max-width:240px;margin:0;padding:10px;border:2px solid var(--line);border-radius:12px"><button class="btn" onclick="typed()">✓</button></div>
    <div id="cres" class="mean en" style="margin-top:12px;font-size:16px"></div>`);
}
function review(t){
  const tips=[];const w=t.split(/\s+/).filter(Boolean).length;
  if(w<4)tips.push('حاول جملة أطول، 4 كلمات على الأقل');
  if(/\bI\s+(is|are)\b/i.test(t))tips.push('مع I استخدم am أو have');
  if(/\b(he|she|it)\s+(don't|do|have|like|want|go|make|work|live|need|take)\b/i.test(t))tips.push('مع he / she / it أضف s للفعل، مثل: he works');
  if(/\b(he|she|it)\s+doesn't\s+\w+s\b/i.test(t))tips.push('بعد doesn\'t الفعل يكون بدون s');
  if(/\ba\s+[aeiou]/i.test(t))tips.push('قبل حرف العلة استخدم an بدل a');
  if(/\bdidn't\s+\w+ed\b/i.test(t))tips.push('بعد didn\'t الفعل يكون بدون ed');
  if(/^[a-z]/.test(t))tips.push('ابدأ الجملة بحرف كبير');
  return tips;
}
function show(t){
  if(!t)return;const tips=review(t);const c=document.getElementById('cres');
  if(c)c.innerHTML='سمعتُ: "'+t+'"'+(tips.length?tips.map(x=>'<div class="muted">💡 '+x+'</div>').join(''):'<div class="muted">ممتاز، جملة صحيحة ✅</div>');
  addXp(tips.length?5:15);save();
}
function typed(){show((document.getElementById('ctxt').value||'').trim())}
function mic(){
  const R=window.SpeechRecognition||window.webkitSpeechRecognition;
  const c=document.getElementById('cres');
  if(!R){if(c)c.innerHTML='<span class="muted">التعرف على الصوت غير مدعوم هنا، اكتب إجابتك في المربع</span>';return}
  const r=new R();r.lang='en-US';
  if(c)c.innerHTML='<span class="muted">🎙️ تحدّث الآن...</span>';
  r.onresult=e=>show(e.results[0][0].transcript.trim());
  r.onerror=e=>{if(c)c.innerHTML='<span class="muted">تعذّر التسجيل ('+e.error+'). اكتب إجابتك في المربع أو راجع إذن الميكروفون</span>'};
  /* الضغط المزدوج على الزر يجعل start() ترمي InvalidStateError.
     كانت تُبتلع صامتة، فتبقى «تحدّث الآن» معروضة بينما لا أحد يستمع. */
  try{r.start()}catch(x){
    logError('بدء التسجيل',x);
    if(c)c.innerHTML='<span class="muted">تعذّر بدء التسجيل. اضغط مرة واحدة فقط، أو اكتب إجابتك في المربع</span>';
  }
}

function base(v){if(/ies$/.test(v))return v.replace(/ies$/,'y');if(/(sses|shes|ches|xes|oes)$/.test(v))return v.replace(/es$/,'');if(/s$/.test(v))return v.slice(0,-1);return v}
function s3(v){if(v==='have')return 'has';if(v==='do')return 'does';if(/[^aeiou]y$/.test(v))return v.slice(0,-1)+'ies';if(/(s|sh|ch|x|o)$/.test(v))return v+'es';return v+'s'}

function fixText(t){let o=t;GR.forEach(r=>{o=o.replace(r.re,r.f)});return o.charAt(0).toUpperCase()+o.slice(1)}
function checkGrammar(t){const out=[];GR.forEach(r=>{if(new RegExp(r.re.source,'i').test(t)&&!out.some(x=>x.ar===r.ar))out.push({ar:r.ar,rid:r.rid})});return out}

function lev(a,b){const m=a.length,n=b.length,d=[];for(let i=0;i<=m;i++)d[i]=[i];for(let j=0;j<=n;j++)d[0][j]=j;for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[m][n]}
function pronScore(target,heard){const T=words(target),H=words(heard);const miss=[],near=[];let ok=0;T.forEach(w=>{if(H.includes(w))ok++;else if(H.some(h=>lev(h,w)<=2))near.push(w);else miss.push(w)});const sc=Math.round(ok/T.length*100);const tips=[];if(T.some(w=>w.includes('th')))tips.push('الصوت th: ضع طرف لسانك بين أسنانك وانفخ بهدوء');if(T.some(w=>w.includes('v')))tips.push('الصوت v: ضع أسنانك العليا على شفتك السفلى');if(T.some(w=>w.includes('r')))tips.push('الصوت r: ارفع طرف لسانك قليلاً دون أن تلمس الحلق');return {sc,miss,near,tips,heard}}

/* يعيد المؤشرين إلى الحدود إن تغيّر عدد المشاهد أو الأدوار بين إصدارين. */
function chatClamp(){const c=S.chat;let moved=false;
  if(!Number.isInteger(c.sc)||c.sc<0||c.sc>=SCENES.length){c.sc=0;c.ti=0;moved=true}
  const t=SCENES[c.sc].turns;
  if(!Number.isInteger(c.ti)||c.ti<0||c.ti>=t.length){c.ti=0;moved=true}
  if(moved){
    logError('ضبط مؤشر المحادثة',new Error('sc/ti خارج الحدود'));
    /* التغذية الراجعة الباقية تخصّ سؤالاً آخر، وعرضها هنا يعلّم المتعلم خطأً. */
    c.stage='reply';c.ok=null;c.g=null;c.said=null;c.fixed=null;c.pr=null;c.hint=false;
    c.fb='تغيّرت المشاهد، فبدأنا من المشهد الأول.';
    save();
  }
}
function chatTurn(){chatClamp();return SCENES[S.chat.sc].turns[S.chat.ti]}
function chatSay(){say(chatTurn().p)}
function chatListen(cb){const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){cb(null,'التعرف على الصوت غير متاح هنا، اكتب الإجابة في المربع');return}const r=new R();r.lang='en-US';r.onresult=e=>cb(e.results[0][0].transcript.trim(),null);r.onerror=e=>cb(null,'تعذّر التسجيل ('+e.error+')');try{r.start()}catch(x){cb(null,'تعذّر بدء التسجيل')}}
function chatMic(){chatListen((t,err)=>{if(err){S.chat.fb=err;render();return}chatReply(t)})}
function chatType(){const v=(document.getElementById('chatTxt')||{}).value;if(v&&v.trim())chatReply(v.trim())}
function chatReply(text){const c=S.chat,T=chatTurn();c.said=text;c.ok=T.need.test(text);c.g=checkGrammar(text);c.fixed=fixText(text);c.g.forEach(x=>S.errs[x.ar]=(S.errs[x.ar]||0)+1);if(!c.ok)c.miss++;c.stage='fb';c.pr=null;c.fb=null;save();render()}
function chatRetry(){const c=S.chat;c.stage='reply';c.ok=null;c.g=null;c.pr=null;c.fb=null;save();render()}
function chatModel(){chatListen((t,err)=>{const c=S.chat;if(err){c.fb=err;render();return}c.pr=pronScore(chatTurn().model,t);c.fb=null;save();render()})}
function chatModelTyped(){const v=(document.getElementById('chatPr')||{}).value;if(!v||!v.trim())return;S.chat.pr=pronScore(chatTurn().model,v.trim());save();render()}
function chatPick(i){const c=S.chat;c.sc=i;c.ti=0;c.stage='reply';c.ok=null;c.g=null;c.fixed=null;c.pr=null;c.fb=null;c.hint=false;save();render();setTimeout(chatSay,300)}
function chatNext(){const c=S.chat,sc=SCENES[c.sc];c.ti++;if(c.ti>=sc.turns.length){c.ti=0;c.sc=(c.sc+1)%SCENES.length}c.miss=0;c.stage='reply';c.ok=null;c.g=null;c.fixed=null;c.pr=null;c.fb=null;c.hint=false;save();render();setTimeout(chatSay,300)}

function pronHtml(p){return `<div style='margin-top:10px'><p>دقة النطق: <b>${p.sc}%</b></p>`+(p.heard?`<p class=muted>سمعتُ: «${p.heard}»</p>`:'')+(p.miss.length?`<p class=muted>كلمات لم تُسمع: ${p.miss.join('، ')}</p>`:'')+(p.near.length?`<p class=muted>كلمات قريبة تحتاج ضبطاً: ${p.near.join('، ')}</p>`:'')+p.tips.map(t=>`<p class=muted>💡 ${t}</p>`).join('')+'</div>'}
function chatHint(){const c=S.chat;c.hint=!c.hint;save();render()}
/* يقارن جملة المتعلّم بالمصححة كلمةً بكلمة (أطول تسلسل مشترك)،
   فيظهر الخطأ مشطوباً والصواب فوقه — كما يفعل المدرّس بالقلم. */
function penDiff(said,fixed){
  const A=String(said||'').split(/\s+/).filter(Boolean);
  const B=String(fixed||'').split(/\s+/).filter(Boolean);
  const norm=w=>w.toLowerCase().replace(/[^\w']/g,'');
  const n=A.length,m=B.length;
  const L=Array.from({length:n+1},()=>new Array(m+1).fill(0));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)
    L[i][j]=norm(A[i])===norm(B[j])?L[i+1][j+1]+1:Math.max(L[i+1][j],L[i][j+1]);
  /* نجمع العمليات أولاً، ثم ندمج كل حذف يتبعه إضافة في علامة واحدة
     يظهر فيها الصواب فوق الخطأ المشطوب، كما يكتب المدرّس بالقلم. */
  const ops=[];let i=0,j=0;
  while(i<n&&j<m){
    if(norm(A[i])===norm(B[j])){ops.push({k:'=',w:B[j]});i++;j++}
    else if(L[i+1][j]>=L[i][j+1]){ops.push({k:'-',w:A[i]});i++}
    else{ops.push({k:'+',w:B[j]});j++}
  }
  while(i<n)ops.push({k:'-',w:A[i++]});
  while(j<m)ops.push({k:'+',w:B[j++]});

  const merged=[];
  for(let k=0;k<ops.length;k++){
    const a=ops[k],b=ops[k+1];
    if(a.k==='-'&&b&&b.k==='+'){merged.push({k:'~',bad:a.w,good:b.w});k++}
    else if(a.k==='+'&&b&&b.k==='-'){merged.push({k:'~',bad:b.w,good:a.w});k++}
    else merged.push(a);
  }

  const esc=t=>String(t).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
  return merged.map(o=>{
    if(o.k==='=')return esc(o.w);
    if(o.k==='~')return '<span class="fix"><u>'+esc(o.good)+'</u><s>'+esc(o.bad)+'</s></span>';
    if(o.k==='-')return '<span class="fix"><s>'+esc(o.w)+'</s></span>';
    return '<span class="fix"><u>'+esc(o.w)+'</u></span>';
  }).join(' ');
}

/* مقاييس من بيانات حقيقية فقط: لا نعرض رقماً لا نحسبه. */
function chatMeters(c){
  const gn=(c.g||[]).length;
  const m=[
    {l:'صلة',  t:c.ok?'مناسبة':'لا تناسب', v:c.ok?100:12, c:c.ok?'var(--teal)':'var(--coral)'},
    {l:'جرامر',t:gn?ar(gn)+' ملاحظة':'سليم', v:gn?Math.max(25,100-gn*30):100, c:gn?'var(--amber)':'var(--green)'}
  ];
  if(c.pr)m.push({l:'نطق',t:ar(c.pr.sc)+'٪',v:c.pr.sc,c:c.pr.sc>=75?'var(--green)':'var(--amber)'});
  else m.push({l:'نطق',t:'لم يُقس بعد',v:0,c:'var(--line)'});
  return `<div class="meters">${m.map(x=>
    `<div class="meter"><b>${x.l} · ${x.t}</b><u><i style="width:${x.v}%;background:${x.c}"></i></u></div>`).join('')}</div>`;
}

function chatFeedback(c,T){
  const clean=!c.g||!c.g.length;
  let h='<div class="stream">';

  /* فقاعة المتعلّم: نصّه كما قاله، والتصحيح داخله لا تحته */
  h+=`<div class="bub me"><p class="en" style="font-size:15.5px;line-height:${clean?'1.6':'2.6'};margin:0">${
    clean?String(c.said||'').replace(/[&<>]/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[x])):penDiff(c.said,c.fixed)}</p></div>`;

  h+='</div>';
  h+=chatMeters(c);

  /* ملاحظة المصحّح بالعربية */
  h+=`<div class="card" style="margin-top:12px;border-right:3px solid ${c.ok?'var(--green)':'var(--amber)'}">`;
  h+=c.ok?'<h2 style="color:var(--green)">فهمت إجابتك</h2>'
         :'<h2 style="color:var(--amber)">إجابتك لا تناسب هذا السؤال</h2>';
  if(!clean){
    h+=c.g.map(x=>`<p class="muted">• ${x.ar}</p>`).join('');
    h+=`<p style="margin-top:9px;font-size:13px;color:var(--mute)">والصحيح أن تقول:</p>
        <p class="en" style="font-size:15.5px;font-weight:600;color:var(--green);margin-top:3px">${c.fixed}</p>`;
  } else h+='<p class="muted">جرامر إجابتك سليم ✅</p>';
  h+=`<p style="margin-top:9px;font-size:13px;color:var(--mute)">الإجابة النموذجية:</p>
      <p class="en" style="font-size:15.5px;font-weight:600;margin-top:3px">${T.model}</p>`;
  h+='</div>';

  if(!clean)h+=c.g.filter(x=>x.rid).map(x=>ruleCard(x.rid,'brief')).join('');

  /* خطوة النطق */
  h+=`<div class="card"><h2>قل الإجابة النموذجية بصوتك</h2>`;
  if(c.pr)h+=pronHtml(c.pr);
  if(c.fb)h+=`<p class="muted">${c.fb}</p>`;
  h+=`<div class="row" style="justify-content:flex-start">
        <button class="btn" onclick="chatModel()">${svg('mic',18,'#fff')} تحدّث</button>
        <button class="btn ghost" onclick="chatNext()">السؤال التالي ←</button></div>
      <div class="row" style="justify-content:flex-start;margin-top:8px">
        <input id="chatPr" class="en" placeholder="أو اكتبها" style="flex:1;min-width:0;padding:11px 13px;border:2px solid var(--line);border-radius:14px;background:var(--surf2);color:var(--ink)">
        <button class="btn ghost" style="margin:0" onclick="chatModelTyped()">✓</button></div>`;
  if(!c.ok)h+=`<div class="row" style="justify-content:flex-start;margin-top:8px"><button class="btn ghost" onclick="chatRetry()">أعد الإجابة</button></div>`;
  return h+'</div>';
}
function speakView(){
  chatClamp();
  const c=S.chat,sc=SCENES[c.sc],T=sc.turns[c.ti];
  const top=Object.entries(S.errs||{}).sort((a,b)=>b[1]-a[1]).slice(0,3);

  /* شرائط المشاهد: المشهد الحالي بارز، والبقية هادئة */
  const picker=`<div style="display:flex;gap:7px;overflow-x:auto;padding:2px 0 4px;-webkit-overflow-scrolling:touch">${
    SCENES.map((x,i)=>`<button class="btn${i===c.sc?'':' ghost'}" style="margin:0;padding:8px 14px;min-height:0;border-radius:999px;font-size:12.5px;white-space:nowrap${i===c.sc?'':';background:var(--surf2);color:var(--mute)'}" onclick="chatPick(${i})">${x.les?'درس '+x.les:x.t}</button>`).join('')}</div>`;

  /* نقاط تقدّم المشهد */
  const dots=sc.turns.map((_,i)=>
    `<span style="width:17px;height:4px;border-radius:2px;background:${i<c.ti?'var(--green)':i===c.ti?'var(--ind)':'var(--line)'}"></span>`).join('');

  let out=`<div class="card" style="padding:14px 16px 16px">
    <div style="display:flex;align-items:center;gap:10px">
      <span style="flex:1;min-width:0"><b style="font-size:14.5px">${sc.t}</b>
        <span class="muted" style="display:block;font-size:11.5px">السؤال ${ar(c.ti+1)} من ${ar(sc.turns.length)}</span></span>
      <span style="display:flex;gap:4px">${dots}</span></div>

    <div class="stream">
      <div class="bub them">
        <p class="en" style="font-size:15.5px;margin:0">${T.p}</p>
        <button class="btn ghost" style="margin-top:7px;padding:6px 11px;min-height:0;font-size:11.5px;background:transparent;color:var(--ind2)" onclick="chatSay()">${svg('sound',13)} استمع</button>
      </div>
    </div>`;

  if(c.stage==='reply'){
    out+=`<div class="row" style="justify-content:flex-start;margin-top:14px">
        <button class="btn" onclick="chatMic()">${svg('mic',18,'#fff')} أجب بصوتك</button>
        <button class="btn ghost" onclick="chatHint()">${c.hint?'إخفاء المثال':'ساعدني'}</button></div>
      <div class="row" style="justify-content:flex-start;margin-top:8px">
        <input id="chatTxt" class="en" placeholder="أو اكتب إجابتك" style="flex:1;min-width:0;padding:11px 13px;border:2px solid var(--line);border-radius:14px;background:var(--surf2);color:var(--ink)">
        <button class="btn" style="margin:0" onclick="chatType()">✓</button></div>`;
    if(c.hint)out+=`<p class="muted" style="margin-top:9px">مثال: <b class="en">${T.model}</b></p>`;
    if(c.fb)out+=`<p class="muted" style="margin-top:9px">${c.fb}</p>`;
    out+='</div>';
  } else {
    out+='</div>'+chatFeedback(c,T);
  }

  out=picker+out;
  if(top.length)out+=card('أخطاؤك المتكررة',
    top.map(([k,v])=>`<p class="muted">• ${k} <span style="color:var(--coral)">(${ar(v)})</span></p>`).join(''));
  return out;
}

const VIEWS={home:homeView,course:courseView,speak:speakView};
render();
</script>
